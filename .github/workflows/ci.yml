name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - code-review-graph
          - mcp-server-git
          - tree-sitter-mcp
          - web-browser-sidecar
          - web-search
          - shell-mcp
          - mcp-test-runner
          - semantic-edit-mcp
          - sqlite-memory-mcp
          - claude-with-servers
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }}

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run tests
        run: nix develop --command make check
      - name: Verify tests ran
        if: always()
        run: |
          TEST_COUNT=$(find tests -name '*.sh' -not -name 'lib.sh' | wc -l)
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "::error::No test scripts found — tests did not run"
            exit 1
          fi
          echo "Found $TEST_COUNT test scripts"
